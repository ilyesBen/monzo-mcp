[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "monzo-mcp"
version = "0.11.1"
description = "Read-only MCP server for the Monzo banking API (personal, joint and business accounts) with OAuth, local transaction cache, and spending analysis."
readme = "README.md"
license = "GPL-3.0-or-later"
authors = [{ name = "Ilyes Benmansour" }]
requires-python = ">=3.13"
keywords = ["monzo", "mcp", "model-context-protocol", "banking", "finance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial",
]
# Every dependency is pinned to an exact version that the suite has been run
# against. A range leaves the choice to the resolver, which is how `mcp` 2.0.0
# reached installs unannounced and broke them. Bump deliberately, never by
# widening a spec.
dependencies = [
    "mcp==2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.0",
]

[project.scripts]
monzo-mcp = "monzo_mcp.cli:main"

[project.urls]
Repository = "https://github.com/ilyesBen/monzo-mcp"
Issues = "https://github.com/ilyesBen/monzo-mcp/issues"
Upstream = "https://github.com/partymola/monzo-mcp"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"src/monzo_mcp/cli.py" = ["E402"]
